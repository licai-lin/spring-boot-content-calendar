spring.application.name=content-calendar

server.http2.enabled=true
# H2 is available through the local-only h2 profile.
# spring.datasource.generate-unique-name=false
# spring.datasource.name=content
# spring.h2.console.enabled=true
# spring.datasource.url=jdbc:h2:mem:content
# spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
# spring.datasource.username=licai
# spring.datasource.password=
spring.sql.init.mode=always

logging.level.org.springframework.jdbc=DEBUG

server.port=8080


cc.welcomeMessage=Welcome to Dan's Content Calendar
cc.about=This is Dan's content calendar

spring.profiles.default=development
# Local development includes the H2 fallback configuration.
spring.profiles.group.development=h2

# endpoint: localhost:8080/actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


